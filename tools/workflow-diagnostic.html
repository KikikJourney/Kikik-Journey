<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Workflow Automation Diagnostic | AI Opportunity Lab</title>
<meta name="description" content="Free five-minute workflow diagnostic. Identify one repetitive business bottleneck and get a fixed-scope automation path.">
<style>body{font-family:system-ui;max-width:820px;margin:auto;padding:28px 18px;line-height:1.6;background:#fafafa;color:#171717}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;margin:16px 0}label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bbb;border-radius:9px;font:inherit}button,.btn{background:#111;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;text-decoration:none;display:inline-block;margin-top:12px}.result{display:none}.muted{color:#666}</style></head>
<body>
<p class="muted">AI Opportunity Lab · Free diagnostic</p>
<h1>Find the workflow worth automating first.</h1>
<p>Answer five questions. This tool does not send your data anywhere; the score is calculated in your browser.</p>
<div class="card">
<label for="frequency">How often does the task happen?</label><select id="frequency"><option value="1">Occasionally</option><option value="2">Weekly</option><option value="3">Daily</option><option value="4">Multiple times per day</option></select>
<label for="minutes">Minutes spent each occurrence</label><input id="minutes" type="number" min="1" value="20">
<label for="people">How many people repeat it?</label><input id="people" type="number" min="1" value="1">
<label for="copy">Does it involve copying/retyping data?</label><select id="copy"><option value="0">No</option><option value="2">Sometimes</option><option value="4">Yes, regularly</option></select>
<label for="systems">How many systems are involved?</label><select id="systems"><option value="1">1</option><option value="2">2</option><option value="3">3+</option></select>
<button onclick="diagnose()">Run diagnostic</button>
</div>
<div id="result" class="card result"><h2 id="headline"></h2><p id="detail"></p><p><strong>Estimated recurring time:</strong> <span id="hours"></span> hours/month</p><p><strong>Suggested path:</strong> <span id="path"></span></p><a id="cta" class="btn" href="../sales/cashflow.html">View fixed-scope workflow offer</a></div>
<script>
function diagnose(){
 const f=+frequency.value,m=Math.max(1,+minutes.value),p=Math.max(1,+people.value),c=+copy.value,s=+systems.value;
 const hours=Math.round((f*(m/60)*p*4.33)*10)/10;
 const score=Math.min(100,Math.round(f*12+Math.min(35,m/5)+Math.min(20,p*5)+c*5+s*5));
 let headline,detail,path,href="../sales/cashflow.html";
 if(score>=70){headline="Strong automation candidate";detail="The workflow has recurring volume, repeated handling and/or multiple systems. A narrow implementation can be tested before building a larger system.";path="Define one trigger, one transformation and one output, then run a fixed-scope pilot.";}
 else if(score>=45){headline="Worth validating";detail="There is measurable repetition, but scope should stay narrow until the time saving is confirmed.";path="Start with a workflow audit or small implementation."; }
 else {headline="Keep it simple for now";detail="The current volume is relatively low. Look for a higher-frequency bottleneck before investing in automation.";path="Track the task for a week and rerun the diagnostic.";href="../sales/checkout.html?offer=validation";}
 result.style.display="block";headlineEl=headline;document.getElementById("headline").textContent=headline;document.getElementById("detail").textContent=detail;document.getElementById("hours").textContent=hours;document.getElementById("path").textContent=path;document.getElementById("cta").href=href;
}
</script></body></html>
