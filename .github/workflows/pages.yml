name: Validate and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sales assets
        run: |
          test -s index.html
          test -s sales/checkout.html
          test -s payment-config.example.json
          python - <<'PY'
          import json
          json.load(open('payment-config.example.json'))
          PY
      - name: Package site artifact
        uses: actions/upload-artifact@v4
        with:
          name: direct-sales-site
          path: |
            index.html
            sales/
            products/ai-opportunity-validation-kit/
            payment-config.example.json
            README.md

# GitHub Pages deployment is intentionally not attempted here until Pages is enabled
# in repository Settings > Pages. The sales site remains first-party and contains no
# marketplace payment integration.
