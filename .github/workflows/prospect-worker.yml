name: Prospect Worker (Hugging Face)

on:
  workflow_dispatch:
  push:
    paths:
      - "workers/**"
      - "tests/test_prospect_worker.py"
      - ".github/workflows/prospect-worker.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate worker contract
        run: |
          python -m py_compile workers/prospect_worker.py
          python -m unittest tests/test_prospect_worker.py -v

  live-model-smoke-test:
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - name: Install llama.cpp
        run: |
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start Qwen3 worker
        run: |
          nohup llama serve -hf ggml-org/Qwen3-1.7B-GGUF:Q4_K_M --host 127.0.0.1 --port 8080 > /tmp/llama-worker.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/llama-worker.log; exit 1
      - name: Run live worker
        run: python workers/prospect_worker.py --input workers/prospect_worker_input.example.json --output prospect_worker_result.json
      - name: Validate live JSON
        run: |
          python - <<'PY'
          import json
          p=json.load(open('prospect_worker_result.json',encoding='utf-8'))
          required={'decision','confidence','problem','buyer_type','matched_offer','priority','evidence','missing_information','reason','next_validation'}
          assert set(p)==required
          assert p['decision'] in {'QUALIFIED','WATCH','REJECT'}
          assert 0<=p['confidence']<=100 and 0<=p['priority']<=100
          print(json.dumps(p,ensure_ascii=False,indent=2))
          PY
      - name: Upload worker result and runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospect-worker-smoke-test
          path: |
            prospect_worker_result.json
            /tmp/llama-worker.log
          if-no-files-found: warn