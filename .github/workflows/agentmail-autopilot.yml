name: Autonomous AgentMail Sales Inbox

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: agentmail-sales-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: |
          python -m py_compile workers/email_autopilot.py
          python -m unittest tests/test_email_autopilot.py -v
      - name: Process AgentMail
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_EMAIL: kikikjourney@agentmail.to
        run: python workers/email_autopilot.py
