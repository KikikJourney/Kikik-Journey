name: Autonomous AgentMail Sales Inbox

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: agentmail-sales-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: |
          python -m py_compile workers/email_autopilot.py workers/problem_solving_engine.py workers/verify_usdt_payment.py
          python -m unittest tests/test_email_autopilot.py tests/test_problem_solving_engine.py tests/test_verify_usdt_payment.py -v
      - name: Process AgentMail
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_EMAIL: kikikjourney@agentmail.to
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAYMENT_RECIPIENT: "0x4ce7004e7127f8b2386eb355e088f127c24b3fac"
        run: python workers/email_autopilot.py
