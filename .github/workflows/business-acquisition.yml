name: Business Acquisition Engine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/business-acquisition.yml"
      - "workers/business_prospect_discovery_v3.py"
      - "workers/business_first_acquisition.py"
      - "workers/batch_prospect_worker.py"
      - "workers/prospect_worker.py"
      - "workers/business_email_outreach.py"
      - "workers/github_opportunity_outreach.py"
      - "workers/revenue_feedback.py"
      - "data/profit_policy.json"
  workflow_dispatch:
    inputs:
      m1_run_id:
        description: "M1 run ID whose acquisition artifact should be reused"
        required: false
        type: string
  workflow_call:
    inputs:
      m1_run_id:
        required: false
        type: string
  schedule:
    - cron: "7 */2 * * *"

permissions:
  contents: read

concurrency:
  group: business-acquisition-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Reuse M1 acquisition queue in orchestrated run
        if: ${{ inputs.m1_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: customer-acquisition-queue
          path: input-m1
          run-id: ${{ inputs.m1_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Discover public business prospects
        if: ${{ inputs.m1_run_id == '' }}
        env:
          KJ_BUSINESS_DISCOVERY_LIMIT: "12"
          KJ_DISCOVERY_TIMEOUT_SECONDS: "6"
          KJ_MAX_CANDIDATES_PER_QUERY: "12"
          KJ_MAX_DISCOVERY_QUERIES: "10"
        run: python workers/business_prospect_discovery_v3.py
      - name: Assert discovery artifact exists
        if: ${{ inputs.m1_run_id == '' }}
        run: test -s business_prospects.json
      - name: Build public-web AgentMail queue
        if: ${{ inputs.m1_run_id == '' }}
        run: python workers/business_first_acquisition.py
      - name: Prepare orchestrated acquisition queue
        if: ${{ inputs.m1_run_id != '' }}
        run: |
          cp input-m1/business_prospects.json business_prospects.json
          cp input-m1/business_first_report.json business_first_report.json
          cp input-m1/customer_leads.json customer_leads.json
          cp input-m1/customer_acquisition.md customer_acquisition.md

      - name: Validate discovery
        run: |
          python -m json.tool business_prospects.json >/dev/null
          python -m json.tool business_first_report.json >/dev/null
          python -m json.tool customer_leads.json >/dev/null
          python -m py_compile workers/business_prospect_discovery_v3.py workers/business_first_acquisition.py workers/business_email_outreach.py workers/revenue_feedback.py
          python -m unittest tests/test_business_first_acquisition.py tests/test_business_prospect_discovery_v3.py tests/test_revenue_feedback.py tests/test_profit_policy_integration.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: business-acquisition-queue
          path: |
            business_prospects.json
            business_first_report.json
            customer_leads.json
            customer_acquisition.md

  qualify:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: business-acquisition-queue
          path: input
      - name: Check actionable business candidates
        id: candidate_gate
        run: |
          python - <<'PY'
          import json, os
          with open("input/customer_leads.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          candidates = [
              lead for lead in payload.get("leads", [])
              if lead.get("status") == "QUALIFIED"
              and lead.get("actionable") is True
              and lead.get("contact_email")
              and lead.get("website")
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_candidates={'true' if candidates else 'false'}\n")
          print(f"Actionable business candidates: {len(candidates)}")
          PY
      - name: Install llama.cpp
        if: steps.candidate_gate.outputs.has_candidates == 'true'
        run: curl -LsSf https://llama.app/install.sh | sh
      - name: Start Qwen worker
        if: steps.candidate_gate.outputs.has_candidates == 'true'
        run: |
          nohup llama serve -hf ggml-org/Qwen3-1.7B-GGUF:Q4_K_M --host 127.0.0.1 --port 8080 > worker.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null && curl -fsS http://127.0.0.1:8080/v1/models >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Qwen worker did not become ready within 120s."
            cat worker.log
            exit 1
          fi
          echo "Qwen worker ready."
      - name: Qualify actionable business prospects
        if: steps.candidate_gate.outputs.has_candidates == 'true'
        run: |
          python workers/batch_prospect_worker.py \
            --input input/customer_leads.json \
            --output worker_prospect_queue.json \
            --limit 3
      - name: Write empty qualification queue when no actionable candidates
        if: steps.candidate_gate.outputs.has_candidates != 'true'
        run: |
          printf '%s\n' '{"count":0,"qualified":0,"watch":0,"reject":0,"results":[]}' > worker_prospect_queue.json
          : > worker.log
      - name: Validate qualification
        run: |
          python -m json.tool worker_prospect_queue.json >/dev/null
          python -m py_compile workers/prospect_worker.py workers/batch_prospect_worker.py
          python -m unittest tests/test_prospect_worker.py tests/test_batch_prospect_worker.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: business-qwen-qualification
          path: |
            worker_prospect_queue.json
            worker.log

  outreach:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: business-acquisition-queue
          path: input
      - uses: actions/download-artifact@v4
        with:
          name: business-qwen-qualification
          path: input/qwen
      - name: Send bounded business outreach
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          KJ_POSTAL_ADDRESS: ${{ secrets.KJ_POSTAL_ADDRESS }}
          AGENTMAIL_INBOX_EMAIL: kikikjourney@agentmail.to
          KJ_MAX_OUTREACH_PER_RUN: "3"
        run: |
          python workers/business_email_outreach.py             --leads input/customer_leads.json             --qwen input/qwen/worker_prospect_queue.json             --report outreach_report.json
      - name: Validate outreach
        run: |
          python -m json.tool outreach_report.json >/dev/null
          python -m py_compile workers/business_email_outreach.py
      - uses: actions/upload-artifact@v4
        with:
          name: business-outreach-report
          path: outreach_report.json

  github-outreach:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: business-acquisition-queue
          path: input
      - name: Evaluate strict GitHub opportunities and outreach
        env:
          AGENT_OUTREACH_API: ${{ secrets.AGENT_OUTREACH_API }}
          KJ_GITHUB_MAX_OUTREACH_PER_RUN: "3"
          KJ_GITHUB_MIN_OUTREACH_SCORE: "80"
          KJ_GITHUB_ACTIVE_DAYS: "90"
          CHECKOUT_BASE_URL: "https://kikikjourney.github.io/Kikik-Journey/sales/manual_order.html"
        run: |
          python workers/github_opportunity_outreach.py \
            --leads input/customer_leads.json \
            --report github_outreach_report.json
      - name: Validate GitHub outreach report
        run: |
          python -m json.tool github_outreach_report.json >/dev/null
          python -m py_compile workers/github_opportunity_outreach.py
          python -m unittest tests/test_github_opportunity_outreach.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: github-outreach-report
          path: github_outreach_report.json
