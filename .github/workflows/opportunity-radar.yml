name: AI Opportunity Radar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: opportunity-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run radar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_ROUTER_BASE_URL: ${{ secrets.AI_ROUTER_BASE_URL }}
          AI_ROUTER_API_KEY: ${{ secrets.AI_ROUTER_API_KEY }}
          AI_ROUTER_MODEL: ${{ secrets.AI_ROUTER_MODEL }}
          NINEROUTER_URL: ${{ secrets.NINEROUTER_URL }}
          NINEROUTER_KEY: ${{ secrets.NINEROUTER_KEY }}
          NINEROUTER_MODEL: ${{ secrets.NINEROUTER_MODEL }}
        run: python opportunity_radar.py

      - name: Verify AI router connectivity
        env:
          AI_ROUTER_BASE_URL: ${{ secrets.AI_ROUTER_BASE_URL }}
          AI_ROUTER_API_KEY: ${{ secrets.AI_ROUTER_API_KEY }}
          NINEROUTER_URL: ${{ secrets.NINEROUTER_URL }}
          NINEROUTER_KEY: ${{ secrets.NINEROUTER_KEY }}
        run: |
          if [ -n "${AI_ROUTER_BASE_URL:-}" ] || [ -n "${NINEROUTER_URL:-}" ]; then
            python - <<'PY'
          import ai_router
          models = ai_router.models()
          print(f"AI router reachable; models exposed: {len(models)}")
          if not models:
              raise SystemExit("AI router is reachable but exposes no models")
          free = [m.get("id") for m in models if isinstance(m, dict) and isinstance(m.get("id"), str) and m["id"].split("/", 1)[0] in {"oc", "kr", "if", "qwen", "vertex"}]
          print("Free-capable models detected:", len(free))
          if free:
              print("Example free model:", free[0])
          PY
          else
            echo "AI router not configured; deterministic radar mode."
          fi

      - name: Package revenue experiments
        run: python opportunity_packager.py

      - name: Validate
        run: |
          python -m json.tool opportunity_report.json >/dev/null
          python -m json.tool revenue_queue.json >/dev/null
          python -m py_compile opportunity_radar.py opportunity_packager.py ai_router.py
          python -m unittest discover -s tests -p "test_*.py" -v
          test -s validation_cards.md

      - name: Upload opportunity report
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-report
          path: opportunity_report.json

      - name: Upload revenue queue
        uses: actions/upload-artifact@v4
        with:
          name: revenue-validation-queue
          path: |
            revenue_queue.json
            validation_cards.md
