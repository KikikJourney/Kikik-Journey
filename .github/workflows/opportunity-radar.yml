name: AI Opportunity Radar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run radar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python opportunity_radar.py

      - name: Validate
        run: |
          python -m json.tool opportunity_report.json >/dev/null
          python -m py_compile opportunity_radar.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-report
          path: opportunity_report.json
