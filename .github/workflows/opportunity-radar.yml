name: AI Opportunity Radar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: opportunity-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run radar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python opportunity_radar.py

      - name: Package revenue experiments
        run: python opportunity_packager.py

      - name: Build customer acquisition queue
        run: python customer_acquisition.py

      - name: Validate
        run: |
          python -m json.tool opportunity_report.json >/dev/null
          python -m json.tool revenue_queue.json >/dev/null
          python -m json.tool customer_leads.json >/dev/null
          python -m json.tool integrations/prospect_queue.json >/dev/null
          python -m json.tool integrations/prospect_queue.schema.json >/dev/null
          python -m py_compile opportunity_radar.py opportunity_packager.py customer_acquisition.py
          python -m unittest discover -s tests -p "test_*.py" -v
          test -s validation_cards.md
          test -s customer_acquisition.md

      - name: Upload opportunity report
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-report
          path: opportunity_report.json

      - name: Upload revenue queue
        uses: actions/upload-artifact@v4
        with:
          name: revenue-validation-queue
          path: |
            revenue_queue.json
            validation_cards.md

      - name: Upload customer acquisition queue
        uses: actions/upload-artifact@v4
        with:
          name: customer-acquisition-queue
          path: |
            customer_leads.json
            customer_acquisition.md

      - name: Upload plugin bridge queue
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bridge-prospect-queue
          path: |
            integrations/prospect_queue.json
            integrations/prospect_queue.schema.json
